<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PartyBox - Minigiochi online da fare con gli amici</title>
<meta name="description" content="Una raccolta di minigiochi da browser da giocare con gli amici: Indovina Chi?, Jeopardy e molto altro in arrivo.">
<meta name="theme-color" content="#3b1d8f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/stagioni/stagioni.css">
<style>
:root{
  --ink:#1b1340;
  --paper:#fffaf0;
  --gold:#ffd23f;
  --radius:30px;
  --border:4px solid var(--ink);
  --font:'Fredoka','Baloo 2','Comic Sans MS',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;min-height:100dvh;
  font-family:var(--font);color:#fff;line-height:1.35;
  background:linear-gradient(120deg,#3b1d8f,#1f6fe5,#12b8c9,#ff4fa3,#7b3fe4,#3b1d8f);
  background-size:400% 400%;
  animation:sfondo 28s ease-in-out infinite;
  overflow-x:hidden;
  display:flex;flex-direction:column;
}
@keyframes sfondo{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg::before,#bg::after{
  content:"";position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(60px);opacity:.35;
  animation:alone 22s ease-in-out infinite alternate;
}
#bg::before{background:radial-gradient(circle,#ffd23f,transparent 65%);top:-25vmax;left:-20vmax}
#bg::after{background:radial-gradient(circle,#ff4fa3,transparent 65%);bottom:-30vmax;right:-25vmax;animation-delay:-11s}
@keyframes alone{from{transform:translate(0,0) scale(1)}to{transform:translate(12vmax,8vmax) scale(1.2)}}
.forma{
  position:absolute;left:var(--x);top:110%;width:var(--s);height:var(--s);
  background:var(--c);opacity:var(--o);
  border:3px solid rgba(255,255,255,.55);
  animation:sale var(--d) linear var(--w) infinite;
  will-change:transform;
}
.forma.cerchio{border-radius:50%}
.forma.quadro{border-radius:22%}
.forma.stella{border:0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.forma.triangolo{border:0;clip-path:polygon(50% 6%,96% 92%,4% 92%)}
@keyframes sale{
  0%{transform:translate3d(0,0,0) rotate(0deg)}
  50%{transform:translate3d(var(--dx),-70vh,0) rotate(calc(var(--r) / 2))}
  100%{transform:translate3d(calc(var(--dx) * -.5),-130vh,0) rotate(var(--r))}
}

.pagina{position:relative;z-index:1;flex:1;width:100%;max-width:1120px;margin:0 auto;
  padding:max(28px,env(safe-area-inset-top)) clamp(16px,4vw,32px) 16px;display:flex;flex-direction:column;align-items:center}

header{text-align:center;margin:clamp(8px,3vw,28px) 0 clamp(22px,4vw,44px)}
.logo{display:flex;justify-content:center;flex-wrap:wrap;gap:.08em;margin:0;font-size:clamp(2.8rem,10vw,6rem);font-weight:700;line-height:1;letter-spacing:.01em;
  -webkit-text-stroke:0;paint-order:stroke fill}
.logo span{display:inline-block;color:var(--c);
  text-shadow:-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),3px 3px 0 var(--ink),0 7px 0 var(--ink),0 10px 0 rgba(27,19,64,.35);
  animation:rimbalza 2.8s ease-in-out infinite;animation-delay:calc(var(--i) * .12s)}
.logo .spazio{width:.3em}
@keyframes rimbalza{0%,60%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-.14em) rotate(-4deg)}45%{transform:translateY(0) rotate(3deg)}}
.sottotitolo{display:inline-block;margin:18px 0 0;padding:8px 20px;font-size:clamp(1rem,2.6vw,1.3rem);font-weight:600;color:var(--ink);
  background:var(--paper);border:var(--border);border-radius:999px;box-shadow:0 5px 0 var(--ink);transform:rotate(-1.5deg)}

.griglia{list-style:none;margin:0;padding:0;width:100%;display:grid;gap:clamp(18px,3vw,32px);
  grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.griglia li{display:flex;perspective:900px}

.card{
  --rx:0deg;--ry:0deg;
  position:relative;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;
  min-height:340px;padding:26px 22px 24px;color:var(--ink);text-decoration:none;
  background:linear-gradient(160deg,var(--a),var(--b));
  border:var(--border);border-radius:var(--radius);box-shadow:0 10px 0 var(--ink),0 22px 30px rgba(10,5,40,.35);
  overflow:hidden;isolation:isolate;
  transform:translateY(0) rotateX(var(--rx)) rotateY(var(--ry));
  transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s ease,filter .3s;
  animation:entra .7s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--i) * .1s + .15s);
  -webkit-tap-highlight-color:transparent;
}
@keyframes entra{from{opacity:0;transform:translateY(46px) scale(.88) rotate(-3deg)}to{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
.card::before{
  content:"";position:absolute;inset:0;z-index:-1;opacity:.28;
  background:radial-gradient(circle at 20% 15%,#fff 0 12%,transparent 13%),
             radial-gradient(circle at 85% 85%,#fff 0 18%,transparent 19%),
             radial-gradient(circle at 92% 12%,#fff 0 6%,transparent 7%);
}
.card::after{
  content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;z-index:0;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);transition:none;
}
.card.attivo{cursor:pointer}
.card.attivo:hover,.card.attivo:focus-visible{
  transform:translateY(-12px) rotateX(var(--rx)) rotateY(var(--ry)) scale(1.03);
  box-shadow:0 18px 0 var(--ink),0 36px 40px rgba(10,5,40,.4);
}
.card.attivo:hover::after,.card.attivo:focus-visible::after{left:130%;transition:left .75s ease}
.card.attivo:active{transform:translateY(4px) scale(.98);box-shadow:0 4px 0 var(--ink),0 10px 14px rgba(10,5,40,.3);transition-duration:.08s}
.card:focus-visible{outline:5px solid #fff;outline-offset:5px}

.icona{
  flex:none;display:grid;place-items:center;width:112px;height:112px;margin-top:6px;font-size:3.6rem;line-height:1;
  background:var(--paper);border:var(--border);border-radius:34%;box-shadow:0 6px 0 var(--ink);transform:rotate(-6deg);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
.icona span{display:block;animation:galleggia 3.4s ease-in-out infinite}
@keyframes galleggia{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.card.attivo:hover .icona,.card.attivo:focus-visible .icona{transform:rotate(7deg) scale(1.14)}
.card.attivo:hover .icona span,.card.attivo:focus-visible .icona span{animation:scuoti .6s ease-in-out}
@keyframes scuoti{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}45%{transform:rotate(12deg)}70%{transform:rotate(-7deg)}}

.card h2{margin:6px 0 0;font-size:clamp(1.55rem,4.4vw,1.95rem);line-height:1.05;font-weight:700;color:#fff;
  text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 4px 0 var(--ink)}
.card p{margin:0;flex:1;font-size:1rem;font-weight:500;line-height:1.35}
.tag{display:inline-block;padding:3px 12px;font-size:.82rem;font-weight:600;background:rgba(255,255,255,.75);border:3px solid var(--ink);border-radius:999px}
.gioca{
  display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:10px 26px;font-size:1.25rem;font-weight:700;letter-spacing:.04em;
  color:var(--ink);background:var(--gold);border:var(--border);border-radius:999px;box-shadow:0 5px 0 var(--ink);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .2s;
}
.gioca svg{width:1em;height:1em;transition:transform .25s}
.card.attivo:hover .gioca,.card.attivo:focus-visible .gioca{transform:scale(1.1);background:#fff}
.card.attivo:hover .gioca svg,.card.attivo:focus-visible .gioca svg{transform:translateX(5px)}

.card.presto{cursor:not-allowed;filter:saturate(.75)}
.card.presto > *:not(.nastro):not(h2){opacity:.5;filter:blur(.6px)}
.card.presto p{opacity:.4}
.card.presto .gioca{background:#ddd}
.nastro{
  position:absolute;left:-12%;top:66%;width:124%;padding:9px 0;z-index:3;
  text-align:center;font-size:clamp(1.25rem,3.6vw,1.55rem);font-weight:700;letter-spacing:.14em;color:var(--ink);
  background:repeating-linear-gradient(135deg,var(--gold) 0 18px,#ffb81c 18px 36px);
  border-block:var(--border);box-shadow:0 6px 0 rgba(27,19,64,.4);
  transform:translateY(-50%) rotate(-9deg);transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
.card.presto:hover .nastro{transform:translateY(-50%) rotate(-6deg) scale(1.05);animation:pulsa 1s ease-in-out infinite}
@keyframes pulsa{50%{filter:brightness(1.12)}}

main{width:100%}
footer{position:relative;z-index:1;padding:26px 20px max(22px,env(safe-area-inset-bottom));text-align:center;font-size:.85rem;font-weight:500;
  color:rgba(255,255,255,.85);text-shadow:0 2px 0 rgba(27,19,64,.6)}
footer p{margin:0 auto;max-width:640px}

noscript .card{opacity:1;animation:none}

@media (max-width:520px){
  .card{min-height:0;padding:22px 18px 22px}
  .icona{width:92px;height:92px;font-size:2.9rem}
  .sottotitolo{padding:6px 16px}
}
@media (hover:none){
  .card.attivo:hover{transform:none;box-shadow:0 10px 0 var(--ink),0 22px 30px rgba(10,5,40,.35)}
  .card.attivo:hover .icona{transform:rotate(-6deg)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .forma{display:none}
  .card{opacity:1}
}
</style>
</head>
<body data-seasonal-page="home">
<div id="bg" aria-hidden="true"></div>

<div class="pagina">
  <header>
    <h1 class="logo" id="logo" aria-label="PartyBox">PartyBox</h1>
    <p class="sottotitolo">Scegli un gioco e sfida i tuoi amici!</p>
  </header>

  <main>
    <ul class="griglia" id="griglia" role="list">
      <noscript>
        <li><a class="card attivo" style="--a:#ffd23f;--b:#ff8a1f;--i:0" href="indovina-chi/indovina-chi.html"><h2>Indovina Chi?</h2><span class="gioca">GIOCA</span></a></li>
      </noscript>
    </ul>
  </main>
</div>

<footer>
  <p>Progetto amatoriale senza scopo di lucro. I nomi, i marchi e i personaggi citati appartengono ai rispettivi proprietari.</p>
</footer>

<script src="/stagioni/stagioni.js" defer></script>
<script>
(function(){
  'use strict';

  /* Per aggiungere un gioco basta una nuova voce in questa lista:
     url: percorso della pagina del gioco, oppure null per mostrare "IN ARRIVO". */
  var GIOCHI = [
    {
      titolo: 'Indovina Chi?',
      descrizione: 'Fai domande, elimina le carte e scopri il personaggio segreto dei tuoi amici.',
      tag: '2-3 giocatori · Online',
      icona: '🕵️',
      colori: ['#ffd23f', '#ff8a1f'],
      url: 'indovina-chi/indovina-chi.html'
    },
    {
      titolo: 'Jeopardy Labs',
      descrizione: 'Crea il tuo tabellone di quiz con categorie e punteggi personalizzati e sfida la squadra.',
      tag: 'Quiz a squadre',
      icona: '💡',
      colori: ['#4aa3ff', '#4b3fe0'],
      url: 'jeopardy/jeopardy.html'
    },
    {
      titolo: 'Erm, Actually!',
      descrizione: 'Smaschera le affermazioni sbagliate sul tuo fandom: chi lo nota per primo vince.',
      tag: 'Ispirato a La Sedia a Due Gambe',
      icona: '🤓',
      colori: ['#ff6fb5', '#9b4dff'],
      url: null
    }
  ];

  var FRECCIA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function crea(tag, classe, testo){
    var e = document.createElement(tag);
    if(classe){ e.className = classe; }
    if(testo){ e.textContent = testo; }
    return e;
  }

  function creaCard(g, i){
    var attivo = !!g.url;
    var li = document.createElement('li');
    var card = document.createElement(attivo ? 'a' : 'div');
    card.className = 'card ' + (attivo ? 'attivo' : 'presto');
    card.style.setProperty('--a', g.colori[0]);
    card.style.setProperty('--b', g.colori[1]);
    card.style.setProperty('--i', i);
    if(attivo){
      card.href = g.url;
    } else {
      card.setAttribute('aria-disabled', 'true');
      card.setAttribute('aria-label', g.titolo + ', in arrivo');
    }

    var icona = crea('div', 'icona');
    icona.setAttribute('aria-hidden', 'true');
    icona.appendChild(crea('span', '', g.icona));
    card.appendChild(icona);
    card.appendChild(crea('h2', '', g.titolo));
    card.appendChild(crea('span', 'tag', g.tag));
    card.appendChild(crea('p', '', g.descrizione));

    var gioca = crea('span', 'gioca', attivo ? 'GIOCA ' : 'PRESTO');
    if(attivo){ gioca.insertAdjacentHTML('beforeend', FRECCIA); }
    card.appendChild(gioca);

    if(!attivo){
      var nastro = crea('div', 'nastro', 'IN ARRIVO');
      nastro.setAttribute('aria-hidden', 'true');
      card.appendChild(nastro);
    }

    if(attivo && window.matchMedia('(hover:hover) and (pointer:fine)').matches){
      card.addEventListener('pointermove', function(e){
        var r = card.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width - .5;
        var y = (e.clientY - r.top) / r.height - .5;
        card.style.setProperty('--ry', (x * 9).toFixed(2) + 'deg');
        card.style.setProperty('--rx', (-y * 9).toFixed(2) + 'deg');
      });
      card.addEventListener('pointerleave', function(){
        card.style.setProperty('--rx', '0deg');
        card.style.setProperty('--ry', '0deg');
      });
    }
    li.appendChild(card);
    return li;
  }

  var griglia = document.getElementById('griglia');
  griglia.textContent = '';
  GIOCHI.forEach(function(g, i){ griglia.appendChild(creaCard(g, i)); });

  var logo = document.getElementById('logo');
  var COLORI_LOGO = ['#ffd23f', '#ff6fb5', '#4aa3ff', '#7be495', '#ff8a1f'];
  var testoLogo = logo.textContent;
  logo.textContent = '';
  testoLogo.split('').forEach(function(c, i){
    var s = crea('span', c === ' ' ? 'spazio' : '', c === ' ' ? ' ' : c);
    s.setAttribute('aria-hidden', 'true');
    s.style.setProperty('--c', COLORI_LOGO[i % COLORI_LOGO.length]);
    s.style.setProperty('--i', i);
    logo.appendChild(s);
  });

  var bg = document.getElementById('bg');
  var TIPI = ['cerchio', 'quadro', 'stella', 'triangolo'];
  var PALETTE = ['#ffd23f', '#ff6fb5', '#4aa3ff', '#7be495', '#ffffff', '#ff8a1f'];
  var quante = window.innerWidth < 640 ? 10 : 18;
  function casuale(a, b){ return a + Math.random() * (b - a); }
  for(var k = 0; k < quante; k++){
    var f = crea('span', 'forma ' + TIPI[k % TIPI.length]);
    f.style.setProperty('--x', casuale(-2, 98).toFixed(1) + '%');
    f.style.setProperty('--s', casuale(22, 74).toFixed(0) + 'px');
    f.style.setProperty('--c', PALETTE[k % PALETTE.length]);
    f.style.setProperty('--o', casuale(.16, .38).toFixed(2));
    f.style.setProperty('--d', casuale(16, 34).toFixed(1) + 's');
    f.style.setProperty('--w', (-casuale(0, 30)).toFixed(1) + 's');
    f.style.setProperty('--dx', casuale(-90, 90).toFixed(0) + 'px');
    f.style.setProperty('--r', casuale(-360, 360).toFixed(0) + 'deg');
    bg.appendChild(f);
  }
})();
</script>
</body>
</html>
