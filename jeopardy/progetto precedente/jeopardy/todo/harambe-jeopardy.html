<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HARAMBE | Jeopardy Quiz</title>
    <style>
        /* Importiamo le variabili CSS dal file styles.css */
        :root {
            --giallo: #FFD700;
            --nero: #222222;
            --bianco: #f5f7fa;
            --grigio-scuro: #2c3e50;
            --grigio-chiaro: #ecf0f1;
            --verde-plus: #2da94e;
            --rosso-minus: #ff0000;
            --font-base: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-base);
            background: var(--grigio-scuro);
            color: var(--bianco);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .quiz-title {
            background: var(--nero);
            color: var(--giallo);
            text-align: center;
            padding: 1rem;
            font-size: 2.5rem;
            font-weight: bold;
            border-bottom: 5px solid var(--giallo);
            flex-shrink: 0;
        }

        .quiz-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            overflow: hidden;
        }

        .quiz-board {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: auto repeat(5, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .category-header {
            background: var(--nero);
            color: var(--giallo);
            padding: 1rem;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--giallo);
        }

        .question-cell {
            background: var(--nero);
            color: var(--giallo);
            border: 2px solid var(--giallo);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .question-cell:hover {
            background: var(--grigio-scuro);
            transform: scale(1.05);
        }

        .question-cell.answered {
            background: var(--grigio-scuro);
            color: var(--grigio-chiaro);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .question-cell.answered:hover {
            transform: none;
        }

        .teams-section {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .team {
            background: var(--grigio-chiaro);
            color: var(--nero);
            border-radius: 8px;
            padding: 1rem;
            min-width: 150px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }

        .team:hover {
            transform: translateY(-5px);
        }

        .team.active {
            border: 3px solid var(--giallo);
            background: var(--bianco);
        }

        .team-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .team-score {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: var(--grigio-scuro);
        }

        .team-controls {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }

        .team-controls button {
            width: 2.5rem;
            height: 2.5rem;
            border: none;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .team-controls .plus {
            background: var(--verde-plus);
            color: var(--bianco);
        }

        .team-controls .minus {
            background: var(--rosso-minus);
            color: var(--bianco);
        }

        .team-controls button:hover {
            transform: scale(1.1);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--bianco);
            color: var(--nero);
            padding: 2rem;
            border-radius: 12px;
            max-width: 80%;
            max-height: 80%;
            overflow-y: auto;
            position: relative;
        }

        .modal-question {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-align: center;
        }

        .modal-answer {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            text-align: justify;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal-actions button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .modal-actions button:hover {
            transform: scale(1.05);
        }

        .correct-btn {
            background: var(--verde-plus);
            color: var(--bianco);
        }

        .wrong-btn {
            background: var(--rosso-minus);
            color: var(--bianco);
        }

        .close-btn {
            background: var(--grigio-scuro);
            color: var(--bianco);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .quiz-title {
                font-size: 2rem;
            }
            
            .category-header {
                font-size: 0.9rem;
                padding: 0.5rem;
            }
            
            .question-cell {
                font-size: 1.5rem;
            }
            
            .teams-section {
                flex-direction: column;
                align-items: center;
            }
            
            .team {
                min-width: 80%;
            }
        }
    </style>
</head>
<body>
    <h1 class="quiz-title">HARAMBE</h1>
    
    <div class="quiz-container">
        <div class="quiz-board" id="quizBoard">
            <!-- Categorie -->
            <div class="category-header">Attack On Titan</div>
            <div class="category-header">Descrizioni Pokémon</div>
            <div class="category-header">MARVEL</div>
            <div class="category-header">Indovinelli</div>
            <div class="category-header">Geografia</div>
            
            <!-- Domande -->
            <div class="question-cell" data-category="0" data-value="100">100</div>
            <div class="question-cell" data-category="1" data-value="100">100</div>
            <div class="question-cell" data-category="2" data-value="100">100</div>
            <div class="question-cell" data-category="3" data-value="100">100</div>
            <div class="question-cell" data-category="4" data-value="100">100</div>
            
            <div class="question-cell" data-category="0" data-value="200">200</div>
            <div class="question-cell" data-category="1" data-value="200">200</div>
            <div class="question-cell" data-category="2" data-value="200">200</div>
            <div class="question-cell" data-category="3" data-value="200">200</div>
            <div class="question-cell" data-category="4" data-value="200">200</div>
            
            <div class="question-cell" data-category="0" data-value="300">300</div>
            <div class="question-cell" data-category="1" data-value="300">300</div>
            <div class="question-cell" data-category="2" data-value="300">300</div>
            <div class="question-cell" data-category="3" data-value="300">300</div>
            <div class="question-cell" data-category="4" data-value="300">300</div>
            
            <div class="question-cell" data-category="0" data-value="400">400</div>
            <div class="question-cell" data-category="1" data-value="400">400</div>
            <div class="question-cell" data-category="2" data-value="400">400</div>
            <div class="question-cell" data-category="3" data-value="400">400</div>
            <div class="question-cell" data-category="4" data-value="400">400</div>
            
            <div class="question-cell" data-category="0" data-value="500">500</div>
            <div class="question-cell" data-category="1" data-value="500">500</div>
            <div class="question-cell" data-category="2" data-value="500">500</div>
            <div class="question-cell" data-category="3" data-value="500">500</div>
            <div class="question-cell" data-category="4" data-value="500">500</div>
        </div>
        
        <div class="teams-section">
            <div class="team" data-team="0">
                <div class="team-name">Team 1</div>
                <div class="team-score">0</div>
                <div class="team-controls">
                    <button class="plus">+</button>
                    <button class="minus">-</button>
                </div>
            </div>
            
            <div class="team" data-team="1">
                <div class="team-name">Team 2</div>
                <div class="team-score">0</div>
                <div class="team-controls">
                    <button class="plus">+</button>
                    <button class="minus">-</button>
                </div>
            </div>
            
            <div class="team" data-team="2">
                <div class="team-name">Team 3</div>
                <div class="team-score">0</div>
                <div class="team-controls">
                    <button class="plus">+</button>
                    <button class="minus">-</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal per le domande -->
    <div id="questionModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-question" id="modalQuestion"></div>
            <div class="modal-answer" id="modalAnswer"></div>
            <div class="modal-actions">
                <button class="correct-btn" id="correctBtn">Risposta Corretta</button>
                <button class="wrong-btn" id="wrongBtn">Risposta Sbagliata</button>
                <button class="close-btn" id="closeBtn">Chiudi</button>
            </div>
        </div>
    </div>

    <script>
        // Database delle domande
        const questions = {
            0: { // Attack On Titan
                100: {
                    question: "Per quale motivo Historia Reiss, futura Regina delle Mura, si trova ad inizio serie ad essere parte del 104° Corpo di Addestramento Reclute?",
                    answer: "Per non morire da bambina venne costretta dal padre a rinunciare al suo nome ed ogni legame con la famiglia reale poiché figlia illegittima di Re Rod Reiss."
                },
                200: {
                    question: "Come nascono i Giganti Puri che tipicamente si trovano nell'isola di Paradis?",
                    answer: "Attraverso un SIERO utilizzato dai marleyani solo sugli eldiani considerati pericolosi."
                },
                300: {
                    question: "Com'è composto l'esercito in difesa della razza umana (eldiani su Eldia, alias 'Paradis', dentro le mura) e quali sono i loro ruoli?",
                    answer: "L'esercito è composto da tre branche principali: Corpo di Ricognizione (esplorazione oltre le mura), Guarnigione (difesa delle mura) e Polizia Militare (ordine pubblico interno)."
                },
                400: {
                    question: "Dimmi quali sono i Nove Giganti originali discendenti da Ymir Fritz ed almeno 9 diversi possessori fra di loro.",
                    answer: "I Nove Giganti sono: Fondatore, Attacco, Corazzato, Colossale, Femmina, Bestia, Mascella, Carro, Martello da Guerra. Possessori includono: Eren (Fondatore/Attacco), Reiner (Corazzato), Bertholdt (Colossale), Annie (Femmina), Zeke (Bestia), Ymir (Mascella), Pieck (Carro), Lara Tybur (Martello), Armin (Colossale)."
                },
                500: {
                    question: "Quante sono le dita che indicano Ymir Fritz nel flashback della sua vita (E21, S4, 'Da te, 2000 anni fa')?",
                    answer: "13"
                }
            },
            1: { // Descrizioni Pokémon
                100: {
                    question: "Gli shuriken creati con il muco prodotto dalle sue cosce sono in grado di recidere di netto cavi di acciaio.",
                    answer: "Greninja, Pokémon Violetto"
                },
                200: {
                    question: "Usa un tipo speciale di arte marziale che coinvolge tutti gli arti. Le sue fiamme non si estinguono mai.",
                    answer: "Infernape, Pokémon Diamante"
                },
                300: {
                    question: "Si dice che prenda per mano i bambini e li accompagni nell'aldilà. Preferisce quelli piccoli e leggeri.",
                    answer: "Drifloon, Pokémon Sole"
                },
                400: {
                    question: "Solca i cieli in cerca di nemici molto forti. Riesce a emettere fiammate di un calore tale da fondere ogni cosa. Tuttavia, non rivolge mai le sue micidiale lingue di fuoco contro avversari più deboli di lui.",
                    answer: "Charizard, Pokémon Rubino Omega e Zaffiro Alpha"
                },
                500: {
                    question: "La maschera che indossa è il volto che aveva quando era un umano. A volte si mette a piangere mentre la guarda.",
                    answer: "Yamask, da Pokémon Nero"
                }
            },
            2: { // MARVEL
                100: {
                    question: "Con chi si è sposata Wanda Maximoff?",
                    answer: "Visione"
                },
                200: {
                    question: "Qual è il vero nome di Wolverine?",
                    answer: "James 'Logan' Howlett"
                },
                300: {
                    question: "Quale fu l'ultimo film in cui Stan Lee ha fatto cameo nell'MCU?",
                    answer: "Avengers: Endgame"
                },
                400: {
                    question: "In quale film dell'MCU ha fatto la sua comparsa per la prima volta lo Spider-Man di Tom Holland?",
                    answer: "Captain America: Civil War (2016). Spider-Man: Homecoming fu nel 2017."
                },
                500: {
                    question: "Prima di Mary Jane Watson chi fu la donna amata da Peter Parker?",
                    answer: "Gwen Stacy. Canonicamente, come nello Spider-Man di Andrew Garfield, morì per mano del Goblin."
                }
            },
            3: { // Indovinelli
                100: {
                    question: "Hanno le gambe ma non hanno i piedi, cosa sono?",
                    answer: "I pantaloni"
                },
                200: {
                    question: "È la cognata della sorella di tuo padre, chi è?",
                    answer: "Tua madre"
                },
                300: {
                    question: "Sale ma non scende, cos'è?",
                    answer: "L'età"
                },
                400: {
                    question: "Vado avanti, vado indietro corro e mi fermo ma non cambio mai di posto. Chi sono?",
                    answer: "Il pendolo"
                },
                500: {
                    question: "Se 5 gatti catturano 5 topi in 5 minuti, quanti topi servono per catturare 100 topi in 100 minuti?",
                    answer: "5"
                }
            },
            4: { // Geografia
                100: {
                    question: "Quale città ospita la sede dell'Unione Europea (UE)?",
                    answer: "Bruxelles"
                },
                200: {
                    question: "Qual è il fiume più lungo al mondo?",
                    answer: "Rio delle Amazzoni"
                },
                300: {
                    question: "La capitale del Brasile si dice San Paolo o São Paulo?",
                    answer: "Brasilia"
                },
                400: {
                    question: "Quale fra questi è il Paese è il più grande per estensione? A) Canada B) Brasile C) Cina D) Stati Uniti",
                    answer: "A) Canada (9,9 milioni di Km²). Le altre opzioni: B) Brasile (8,5 milioni di Km²) C) Cina (9,7 milioni di Km²) D) Stati Uniti (9,3 milioni di Km²)"
                },
                500: {
                    question: "Elencami gli Stati confinanti con l'Italia.",
                    answer: "San Marino, Città del Vaticano, Francia, Svizzera, Austria e Slovenia"
                }
            }
        };

        // Variabili globali
        let currentTeam = 0;
        let currentQuestion = null;
        let currentValue = 0;

        // Elementi DOM
        const modal = document.getElementById('questionModal');
        const modalQuestion = document.getElementById('modalQuestion');
        const modalAnswer = document.getElementById('modalAnswer');
        const correctBtn = document.getElementById('correctBtn');
        const wrongBtn = document.getElementById('wrongBtn');
        const closeBtn = document.getElementById('closeBtn');
        const teams = document.querySelectorAll('.team');
        const questionCells = document.querySelectorAll('.question-cell');

        // Inizializzazione
        function init() {
            setupEventListeners();
            highlightCurrentTeam();
        }

        function setupEventListeners() {
            // Eventi per le celle delle domande
            questionCells.forEach(cell => {
                cell.addEventListener('click', handleQuestionClick);
            });

            // Eventi per i controlli dei team
            teams.forEach(team => {
                const plusBtn = team.querySelector('.plus');
                const minusBtn = team.querySelector('.minus');
                
                plusBtn.addEventListener('click', () => adjustScore(team, currentValue));
                minusBtn.addEventListener('click', () => adjustScore(team, -currentValue));
                
                team.addEventListener('click', () => setCurrentTeam(team));
            });

            // Eventi per il modal
            correctBtn.addEventListener('click', () => handleAnswer(true));
            wrongBtn.addEventListener('click', () => handleAnswer(false));
            closeBtn.addEventListener('click', closeModal);
            
            // Chiudi modal cliccando fuori
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
        }

        function handleQuestionClick(e) {
            const cell = e.target;
            
            if (cell.classList.contains('answered')) return;
            
            const category = parseInt(cell.dataset.category);
            const value = parseInt(cell.dataset.value);
            
            currentQuestion = questions[category][value];
            currentValue = value;
            
            showQuestion(currentQuestion);
        }

        function showQuestion(question) {
            modalQuestion.textContent = question.question;
            modalAnswer.textContent = question.answer;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
            currentQuestion = null;
            currentValue = 0;
        }

        function handleAnswer(isCorrect) {
            if (!currentQuestion) return;
            
            const currentTeamEl = document.querySelector('.team.active') || teams[currentTeam];
            
            if (isCorrect) {
                adjustScore(currentTeamEl, currentValue);
            } else {
                adjustScore(currentTeamEl, -currentValue);
            }
            
            // Marca la domanda come risposta
            const cell = document.querySelector(`[data-category="${getCurrentCategory()}"][data-value="${currentValue}"]`);
            if (cell) {
                cell.classList.add('answered');
            }
            
            closeModal();
            nextTeam();
        }

        function getCurrentCategory() {
            // Trova la categoria basata sulla domanda corrente
            for (let cat in questions) {
                for (let val in questions[cat]) {
                    if (questions[cat][val] === currentQuestion) {
                        return cat;
                    }
                }
            }
            return 0;
        }

        function adjustScore(teamEl, points) {
            const scoreEl = teamEl.querySelector('.team-score');
            const currentScore = parseInt(scoreEl.textContent);
            scoreEl.textContent = currentScore + points;
        }

        function setCurrentTeam(teamEl) {
            teams.forEach(team => team.classList.remove('active'));
            teamEl.classList.add('active');
            currentTeam = parseInt(teamEl.dataset.team);
        }

        function nextTeam() {
            currentTeam = (currentTeam + 1) % teams.length;
            highlightCurrentTeam();
        }

        function highlightCurrentTeam() {
            teams.forEach(team => team.classList.remove('active'));
            teams[currentTeam].classList.add('active');
        }

        // Inizializza il gioco
        init();
    </script>
</body>
</html>
